# Baut die Web-App bei jedem Push auf GitHub und veröffentlicht sie auf GitHub Pages:
# https://hernandezgranadosmatias3-ai.github.io/jetzt/
name: Web-App bauen und veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Tests der Planungslogik
        run: npm test
      - name: Web-Version bauen
        run: npx expo export --platform web --output-dir dist
      - name: Für GitHub Pages vorbereiten
        run: cp dist/index.html dist/404.html && touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
